version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The jest toolchain tracks the Expo SDK: expo-doctor enforces the SDK's
      # expected versions (e.g. SDK 57 -> jest 29 / jest-expo 57 / @types/jest 29).
      # Bump these together with the SDK, not on their own.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
