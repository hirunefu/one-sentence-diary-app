version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The navigators peer-depend on a matching @react-navigation/native
      # (and each other's shared deps), so update them in one PR.
      react-navigation:
        patterns:
          - "@react-navigation/*"
    ignore:
      # The Expo SDK dictates these versions (node_modules/expo/
      # bundledNativeModules.json plus the SDK's relatedPackages). expo-doctor
      # fails on any drift and `npx expo install --fix` reverts it, so they
      # only move with the SDK (`npx expo install expo@^N --fix`). Note that
      # `ignore` also suppresses Dependabot security PRs for them; alerts
      # still show in the Security tab.
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@types/jest"
      - dependency-name: "jest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/vector-icons"
        update-types: ["version-update:semver-major"]
      # SDK upgrades are deliberate. Patch releases within the SDK still come
      # through, but run `npx expo install --fix` on the PR before merging so
      # the expo-* modules follow.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # Exact pins that must equal another package's version: the preset
      # matches react-native (whose peer on it is exact), and test-renderer's
      # minor tracks React's (1.2.x = React 19.2). A standalone bump breaks
      # `npm ci` with ERESOLVE or leaves an invalid peer tree.
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: "test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
