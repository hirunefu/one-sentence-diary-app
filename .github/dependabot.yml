version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The jest toolchain tracks the Expo SDK: expo-doctor enforces the SDK's
      # expected versions (e.g. SDK 57 -> jest 29 / jest-expo 57 / @types/jest 29).
      # Bump these together with the SDK, not on their own.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # Exact pins that must equal another package's version: the preset
      # matches react-native (whose peer on it is exact) and the renderer
      # matches react. A standalone bump of either breaks `npm ci` with
      # ERESOLVE, so they only move together with the SDK upgrade.
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: "react-test-renderer"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
