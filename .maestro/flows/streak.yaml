appId: com.hirunefu.onesentencediary
---
- launchApp:
    clearState: true
    stopApp: true

# This flow assumes the runner set the device date to 2026-05-15 via
# `./scripts/e2e/run.sh --at-date 2026-05-15 streak`.

- tapOn:
    id: "entry-input"
- inputText: "day 1"
- hideKeyboard
- tapOn:
    id: "save-button"

# Advance through 6 more days by directly opening the editor for each
# past date. Day cells expose testID="day-YYYY-MM-DD".
- tapOn:
    id: "tab-history"
- tapOn:
    id: "history-tab-calendar"

# Iterate over the previous 6 days (2026-05-14 down to 2026-05-09).
# Maestro doesn't have a loop primitive — list each day explicitly.
- tapOn:
    id: "day-2026-05-14"
- tapOn:
    id: "entry-input"
- inputText: "day 14"
- hideKeyboard
- tapOn:
    id: "editor-save"

- tapOn:
    id: "day-2026-05-13"
- tapOn:
    id: "entry-input"
- inputText: "day 13"
- hideKeyboard
- tapOn:
    id: "editor-save"

- tapOn:
    id: "day-2026-05-12"
- tapOn:
    id: "entry-input"
- inputText: "day 12"
- hideKeyboard
- tapOn:
    id: "editor-save"

- tapOn:
    id: "day-2026-05-11"
- tapOn:
    id: "entry-input"
- inputText: "day 11"
- hideKeyboard
- tapOn:
    id: "editor-save"

- tapOn:
    id: "day-2026-05-10"
- tapOn:
    id: "entry-input"
- inputText: "day 10"
- hideKeyboard
- tapOn:
    id: "editor-save"

- tapOn:
    id: "day-2026-05-09"
- tapOn:
    id: "entry-input"
- inputText: "day 9"
- hideKeyboard
- tapOn:
    id: "editor-save"

# Back to home. The Streak jumped from 1 to 7 while Home was hidden, so the
# full-screen celebration tells only the highest Milestone crossed: 7, not 3.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "celebration"
    timeout: 5000
- assertVisible:
    id: "celebration-number"
    text: "7"
- assertVisible: "1週間、続きました。"
- tapOn:
    id: "celebration-close"
- extendedWaitUntil:
    notVisible:
      id: "celebration"
    timeout: 3000

# The streak counter must read 7, and History shows it as the Longest streak.
- assertVisible: "7"
- assertVisible: "日連続"
- tapOn:
    id: "tab-history"
- assertVisible:
    id: "history-longest-streak"
    text: "最長記録 7日"
